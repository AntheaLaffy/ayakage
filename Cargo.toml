[package]
name = "ayakage"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
description = "An open-source, Linux-first Live2D VTuber studio"
license = "MIT"
repository = "https://github.com/AntheaLaffy/ayakage"

[dependencies]
anyhow = "1.0"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui = "0.37"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
mocari = { version = "=0.4.0", features = ["wgpu"] }
pollster = "1.0"
rfd = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wgpu = "30.0"

[profile.release]
lto = "thin"
strip = true
