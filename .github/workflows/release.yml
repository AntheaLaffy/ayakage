name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a version tag on main
        run: |
          test "$GITHUB_REF_TYPE" = tag
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python3 - <<'PY'
          import json, os, re, subprocess
          tag = os.environ['GITHUB_REF_NAME']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
              raise SystemExit('Use a vMAJOR.MINOR.PATCH tag.')
          data = json.loads(subprocess.check_output(['cargo', 'metadata', '--locked', '--no-deps', '--format-version', '1']))
          version = data['packages'][0]['version']
          if tag != f'v{version}':
              raise SystemExit(f'Tag {tag} does not match Cargo version {version}.')
          with open('CHANGELOG.md', encoding='utf-8') as source:
              if f'## {version} ·' not in source.read():
                  raise SystemExit('Add this version to CHANGELOG.md before releasing.')
          PY

  verify:
    needs: version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: [version, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-x86_64
          path: dist
      - name: Verify checksums and release provenance
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          python3 - <<'PY'
          import glob, json, os, pathlib, tarfile
          archives = glob.glob('dist/*.tar.gz')
          if len(archives) != 1:
              raise SystemExit('Expected exactly one tested archive.')
          with tarfile.open(archives[0]) as archive:
              info = json.load(archive.extractfile('kage-studio-linux-x86_64/build-info.json'))
          if info['source_commit'] != os.environ['GITHUB_SHA'] or info['source_dirty']:
              raise SystemExit('Archive must come from this clean tagged commit.')
          if f"v{info['version']}" != os.environ['GITHUB_REF_NAME']:
              raise SystemExit('Archive version does not match the tag.')
          text = pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8')
          notes = text.split(f"## {info['version']} ·", 1)[1].split('\n', 1)[1].split('\n## ', 1)[0].strip()
          notes += '\n\n构建与完整 CI：' + os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'] + '\n'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'release-notes.md').write_text(notes, encoding='utf-8')
          PY
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == v0.* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag --target "$GITHUB_SHA" --title "Kage Studio $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"
