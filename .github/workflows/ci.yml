name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust format and Python syntax
        run: |
          cargo fmt --check
          python3 -m compileall -q tools
      - name: Validate GitHub workflows
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  test:
    name: test (${{ matrix.rust }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rust: ['1.95.0', '1.98.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libwayland-dev libxkbcommon-dev libx11-dev \
            libxcursor-dev libxi-dev libxrandr-dev libegl1-mesa-dev
      - name: Install Rust
        env:
          RUST_VERSION: ${{ matrix.rust }}
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ runner.os }}-${{ matrix.rust }}-${{ hashFiles('Cargo.lock') }}-v1
      - name: Unit and localhost UDP tests
        env:
          RUST_VERSION: ${{ matrix.rust }}
        run: cargo +"$RUST_VERSION" test --locked
      - name: Clippy
        if: matrix.rust == '1.98.1'
        run: cargo clippy --locked --all-targets -- -D warnings

  linux:
    # Keep the portable executable's glibc baseline at Ubuntu 22.04 / 2.35.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      WGPU_BACKEND: vulkan
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux runtime and software GPU
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libwayland-dev libxkbcommon-dev libx11-dev \
            libxcursor-dev libxi-dev libxrandr-dev libegl1-mesa-dev \
            libxkbcommon-x11-0 mesa-vulkan-drivers xvfb xauth python3-pil
          install -d -m 700 "$RUNNER_TEMP/kage-runtime"
          printf 'XDG_RUNTIME_DIR=%s/kage-runtime\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: release-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-v1
      - name: Build portable archive and notices
        run: python3 tools/package.py --archive
      - name: Fetch pinned external test model
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Eatgrapes/Mocari
          ref: 13c7ed3c1e6471bcc1aacf5e7d3fdb1d038ed759
          path: .local/ci-fixtures
          sparse-checkout: assets/models/Haru
          persist-credentials: false
      - name: Verify extracted package, real model, UDP and native windows
        run: |
          /usr/bin/python3 tools/ci_smoke.py \
            --package dist/kage-studio-*-linux-x86_64.tar.gz \
            --model .local/ci-fixtures/assets/models/Haru/Haru.model3.json \
            --output-dir .local/ci-result --max-glibc 2.35 --require-clean
      - name: Upload tested portable archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x86_64
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload numeric verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-reports
          path: |
            .local/ci-result/report.json
            .local/ci-result/render/report.json
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true

  required:
    if: always()
    needs: [quality, test, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          if failed:
              raise SystemExit(f'Required checks did not pass: {failed}')
          print('All required checks passed.')
          PY
